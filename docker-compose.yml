services:
  db:
    image: postgres:16
    container_name: bop_postgres
    restart: always
    environment:
      POSTGRES_USER: bop_user
      POSTGRES_PASSWORD: bop_password
      POSTGRES_DB: bop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bop_user -d bop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bop_app
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://bop_user:bop_password@db:5432/bop_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
